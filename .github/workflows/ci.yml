name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch cancels the run still in progress
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

  smoke:
    name: Docker smoke test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Start the full stack
        run: docker compose up -d --build --wait

      - name: Wait for the API (through the web container)
        run: |
          for i in $(seq 1 30); do
            curl -fs http://localhost:8080/api/health && exit 0
            sleep 2
          done
          echo "API did not become healthy"
          exit 1

      - name: Create and list a todo
        run: |
          curl -fs -X POST http://localhost:8080/api/todos \
            -H 'Content-Type: application/json' \
            -d '{"title":"CI smoke test"}'
          curl -fs http://localhost:8080/api/todos | grep -q 'CI smoke test'

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop the stack
        if: always()
        run: docker compose down -v

