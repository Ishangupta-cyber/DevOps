# Way 2: build both images on the GitHub runner and push them to Docker Hub,
# then SSH into EC2, pull those images from Docker Hub and start the stack.
name: Deploy to EC2 (via Docker Hub)

on:
  workflow_dispatch:

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      API_REPO: ${{ secrets.DOCKERHUB_USERNAME }}/daymark-api
      WEB_REPO: ${{ secrets.DOCKERHUB_USERNAME }}/daymark-web
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.API_REPO }}:${{ github.sha }}
            ${{ env.API_REPO }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          push: true
          tags: |
            ${{ env.WEB_REPO }}:${{ github.sha }}
            ${{ env.WEB_REPO }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Copy deploy files to EC2
        run: |
          ssh -i ~/.ssh/ec2.pem "$EC2_USER@$EC2_HOST" 'mkdir -p ~/daymark'
          scp -i ~/.ssh/ec2.pem deploy/* "$EC2_USER@$EC2_HOST:~/daymark/"

      - name: Pull images from Docker Hub and deploy
        env:
          API_IMAGE: ${{ env.API_REPO }}:${{ github.sha }}
          WEB_IMAGE: ${{ env.WEB_REPO }}:${{ github.sha }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          ssh -i ~/.ssh/ec2.pem "$EC2_USER@$EC2_HOST" "
            set -e
            docker pull '$API_IMAGE'
            docker pull '$WEB_IMAGE'
            API_IMAGE='$API_IMAGE' WEB_IMAGE='$WEB_IMAGE' POSTGRES_PASSWORD='$POSTGRES_PASSWORD' sh ~/daymark/deploy.sh
          "
