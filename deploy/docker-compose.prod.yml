# Production stack for the EC2 host. Images are never built here: they are
# either loaded from a tarball (deploy-ssh.yml) or pulled from Docker Hub
# (deploy-dockerhub.yml). API_IMAGE, WEB_IMAGE and POSTGRES_PASSWORD come
# from .env, which deploy.sh writes on every deploy.
services:
  web:
    image: ${WEB_IMAGE:?WEB_IMAGE is required}
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # No published port: only the web container can reach the API.
  # Three replicas share the load; nginx in the web image balances them.
  api:
    image: ${API_IMAGE:?API_IMAGE is required}
    deploy:
      replicas: 3
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      PORT: 3000
      DATABASE_URL: postgres://todo:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/todo
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: todo
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d todo"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
