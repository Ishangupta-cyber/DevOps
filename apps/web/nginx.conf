# Docker's internal DNS. This file is included inside nginx's http block, so
# the resolver applies to the upstream below.
resolver 127.0.0.11 valid=10s;

# Load balancer: "api" resolves to one IP per api replica, and nginx spreads
# requests across them round-robin. "resolve" re-reads DNS while running, so
# scaling or redeploying the api containers needs no nginx restart.
upstream api_backend {
    zone api_backend 64k;
    server api:3000 resolve max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api_backend;
        # If a replica is down, try the next one instead of failing. Containers
        # on one host connect in milliseconds, so a dead one is found fast.
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
